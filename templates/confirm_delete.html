{% extends 'base.html' %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="section-label">
  <span class="num">[05]</span>
  <span class="sep">/</span>
  <span class="name">Confirm Delete</span>
  <span class="line"></span>
  <span class="meta">{{ type }}/delete</span>
</div>
<div class="card" style="max-width:480px; margin:0 auto;">
  <div class="b-label">warning.log</div>
  <p style="margin-bottom:1.5rem;">Are you sure you want to delete this <strong>{{ type }}</strong>? This action cannot be undone.</p>
  <form method="post" style="display:flex; gap:0.75rem;">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
